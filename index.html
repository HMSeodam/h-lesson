<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f4ed" />
  <title>Hmseodam Learning Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand-wrap">
      <div class="brand-mark" aria-hidden="true">
        <div class="mark-disc">
          <span class="page page-1"></span>
          <span class="page page-2"></span>
          <span class="page page-3"></span>
          <span class="spine"></span>
        </div>
      </div>
      <div class="brand-stack">
        <div class="brand">HLL</div>
        <div class="brand-sub">Hmseodam Learning Lab</div>
      </div>
    </div>
    <button id="themeBtn" class="ghost-btn" type="button">다크 모드</button>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <button id="mobileFilterToggle" class="mobile-filter-toggle" type="button" aria-expanded="false" aria-controls="mobileFilterPanel">
        <span class="mobile-filter-copy">
          <strong>수업 선택</strong>
          <small id="mobileFilterSummary">학교 · 과목 · 주차</small>
        </span>
        <span class="mobile-filter-chevron" aria-hidden="true">⌄</span>
      </button>
      <div class="sidebar-card" id="mobileFilterPanel">
        <div class="field"><label>학교</label><select id="schoolSelect"></select></div>
        <div class="field"><label>연도</label><select id="yearSelect"></select></div>
        <div class="field"><label>학기</label><select id="semesterSelect"></select></div>
        <div class="field"><label>과목</label><select id="courseSelect"></select></div>
        <div class="field"><label>주차</label><select id="weekSelect"></select></div>
      </div>
      <nav class="mode-nav" aria-label="학습 모드">
        <button class="mode-btn active" data-mode="overview">한눈에 보기</button>
        <button class="mode-btn" data-mode="learn">학습하기</button>
        <button class="mode-btn" data-mode="quiz">퀴즈</button>
      </nav>
      <button id="exportOpenBtn" class="export-open-btn" type="button">
        <span class="export-open-icon" aria-hidden="true">↓</span>
        <span><strong>학습자료 저장</strong><small>PNG · JPG · PDF · DOCX</small></span>
      </button>
      <div class="progress-card">
        <div class="progress-head"><span>학습 진도</span><strong id="progressText">0%</strong></div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <button id="resetProgress" class="text-btn" type="button">진도 초기화</button>
      </div>
    </aside>

    <section class="content-area">
      <div id="loading" class="loading">자료를 불러오는 중…</div>
      <div id="content"></div>
    </section>
  </main>

  <div id="exportModal" class="export-modal" hidden>
    <div class="export-modal-backdrop" data-export-close></div>
    <section class="export-dialog" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
      <button class="export-close" type="button" data-export-close aria-label="닫기">×</button>
      <div class="export-dialog-head">
        <span class="export-kicker">DOWNLOAD</span>
        <h2 id="exportTitle">학습카드 저장</h2>
        <p>현재 주차의 학습카드를 학생용 파일로 저장합니다.</p>
      </div>
      <label class="export-field">
        <span>파일 형식</span>
        <select id="exportFormat">
          <option value="pdf">PDF 문서 (.pdf)</option>
          <option value="png">PNG 이미지 묶음 (.zip)</option>
          <option value="jpg">JPG 이미지 묶음 (.zip)</option>
          <option value="docx">Word 문서 - 카드 이미지형 (.docx)</option>
        </select>
      </label>
      <div class="export-filename-box">
        <span>기본 저장명</span>
        <strong id="exportFilenamePreview">학교_연도_학기_과목_주차</strong>
      </div>
      <p class="export-note">한눈에 보기의 학습카드가 저장됩니다. PNG/JPG는 카드별 이미지가 ZIP 파일에 담기며, PDF/DOCX는 카드별 페이지로 구성됩니다.</p>
      <div class="export-status" id="exportStatus" aria-live="polite"></div>
      <div class="export-actions">
        <button class="next-btn secondary" type="button" data-export-close>취소</button>
        <button class="next-btn" id="exportStartBtn" type="button">다운로드</button>
      </div>
    </section>
  </div>

  <template id="toastTemplate"><div class="toast"></div></template>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
