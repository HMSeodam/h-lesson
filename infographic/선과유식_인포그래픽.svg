<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2350" viewBox="0 0 1200 2350">
<rect width="1200" height="2350" fill="#eee9df"/>
<foreignObject x="40" y="40" width="1120" height="2270">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,'Noto Sans KR',sans-serif;background:#f9f6ef;color:#1d2a25;padding:38px;border-radius:28px;height:2194px;box-sizing:border-box;overflow:hidden">
  <div style="background:linear-gradient(145deg,#20372f,#5d776d);color:white;border-radius:30px;padding:42px 46px;height:330px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end">
    <div style="font-size:13px;letter-spacing:2px;font-weight:700;opacity:.75">WEEK 01 · 시작하며</div>
    <div style="font-size:58px;line-height:1.05;font-weight:900;margin-top:12px">선과 유식,<br/>정말 반대일까?</div>
    <div style="font-size:18px;line-height:1.55;margin-top:14px;opacity:.85">체험의 직접성과 논리의 정밀함 사이에서 ‘진실한 자기’를 묻다</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px">
    <div style="background:white;border:1px solid #ddd7cb;border-radius:24px;padding:26px"><div style="font-size:28px;font-weight:900">선 禪</div><div style="display:inline-block;background:#e6ddcc;color:#49685c;border-radius:999px;padding:6px 10px;margin:8px 0 14px;font-size:12px;font-weight:800">직접 체험</div><div style="line-height:1.7;font-size:15px"><b>언어관</b> · 불립문자·교외별전<br/><b>깨달음</b> · 돈오<br/><b>출발점</b> · 대의단<br/><b>표현</b> · 체험의 한가운데서 간명하게 발화</div></div>
    <div style="background:white;border:1px solid #ddd7cb;border-radius:24px;padding:26px"><div style="font-size:28px;font-weight:900">유식 唯識</div><div style="display:inline-block;background:#e6ddcc;color:#49685c;border-radius:999px;padding:6px 10px;margin:8px 0 14px;font-size:12px;font-weight:800">논리 체계</div><div style="line-height:1.7;font-size:15px"><b>언어관</b> · 세밀한 개념과 논리<br/><b>성불 과정</b> · 삼대아승기<br/><b>출발점</b> · 신심<br/><b>표현</b> · 체험 세계를 정합적으로 체계화</div></div>
  </div>
  <div style="background:#20372f;color:white;border-radius:24px;padding:28px;margin-top:18px"><div style="font-size:20px;font-weight:800;opacity:.78">선의 충격적인 표현</div><div style="font-family:serif;font-size:34px;line-height:1.4;margin-top:10px">“무엇이 석가의 몸인가?” — “마른 똥 막대기!”</div><div style="font-size:14px;line-height:1.6;opacity:.72;margin-top:10px">장엄한 관념을 설명으로 강화하기보다 고정된 관념을 깨뜨리는 예.</div></div>
  <div style="background:white;border:1px solid #ddd7cb;border-radius:24px;padding:28px;margin-top:18px"><div style="font-size:30px;font-weight:900">유식은 세계를 ‘설명 가능한 구조’로 만든다</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px"><div style="background:#f3efe6;border-radius:18px;padding:20px"><b>① 아뢰야식과 마음 분석</b><div style="font-size:14px;line-height:1.6;margin-top:8px;color:#66706b">의식 아래 세계와 마음 작용을 세밀하게 구분한다.</div></div><div style="background:#f3efe6;border-radius:18px;padding:20px"><b>② 삼신과 사지</b><div style="font-size:14px;line-height:1.6;margin-top:8px;color:#66706b">자성신·수용신·변화신과 네 지혜의 관계를 논한다.</div></div><div style="background:#f3efe6;border-radius:18px;padding:20px"><b>③ 수행 과정</b><div style="font-size:14px;line-height:1.6;margin-top:8px;color:#66706b">초발심에서 성불까지 장대한 수행 단계를 설명한다.</div></div></div></div>
  <div style="background:white;border:1px solid #ddd7cb;border-radius:24px;padding:28px;margin-top:18px"><div style="font-size:30px;font-weight:900">그러나 둘이 묻는 중심 질문은 같다</div><div style="display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:14px;margin-top:18px;align-items:stretch"><div style="background:#f3efe6;border-radius:18px;padding:22px;text-align:center"><div style="font-size:24px;font-weight:900">선</div><div style="font-size:14px;line-height:1.6;margin-top:8px">본래면목·기사구명<br/>‘나는 누구인가?’를 끝까지 파고든다.</div></div><div style="background:#20372f;color:white;border-radius:18px;padding:26px;text-align:center"><div style="font-size:28px;font-weight:900">진실한 자기</div><div style="font-size:14px;line-height:1.6;margin-top:9px;opacity:.75">주관과 객관의 분열 이전에서 자기와 세계의 진실을 규명</div></div><div style="background:#f3efe6;border-radius:18px;padding:22px;text-align:center"><div style="font-size:24px;font-weight:900">유식</div><div style="font-size:14px;line-height:1.6;margin-top:8px">무아·공·집착 구조를 이해하고 수행으로 진실한 자기를 실현</div></div></div><div style="background:#e6ddcc;border-radius:16px;padding:16px;text-align:center;margin-top:12px;font-weight:800">공통 수행 기반 · 유가행과 좌선</div></div>
  <div style="background:white;border:1px solid #ddd7cb;border-radius:24px;padding:28px;margin-top:18px"><div style="font-size:30px;font-weight:900">핵심 차이 = 체험 ↔ 논리의 무게중심</div><div style="margin-top:24px"><div style="display:flex;justify-content:space-between;color:#66706b;font-size:13px;font-weight:800"><span>직접 체험</span><span>논리·체계</span></div><div style="height:14px;border-radius:999px;background:linear-gradient(90deg,#78978c,#d4bc8e);margin:26px 0;position:relative"><div style="position:absolute;left:20%;top:-7px;width:28px;height:28px;border-radius:50%;background:#20372f;border:5px solid white"></div><div style="position:absolute;left:80%;top:-7px;width:28px;height:28px;border-radius:50%;background:#20372f;border:5px solid white"></div></div><div style="display:flex;justify-content:space-between;font-size:15px"><b>선 · 체험의 직접성</b><b>유식 · 논리적 체계화</b></div></div></div>
  <div style="background:white;border:1px solid #ddd7cb;border-radius:24px;padding:28px;margin-top:18px"><div style="font-size:30px;font-weight:900">다르기 때문에 서로 필요하다</div><div style="display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:14px;margin-top:18px"><div style="background:#f3efe6;border-radius:18px;padding:20px"><b>선의 위험</b><div style="font-size:14px;line-height:1.6;margin-top:8px">체험만 있고 의미를 검토하지 않으면 비일상 경험에 머물 수 있다.</div><hr style="border:0;border-top:1px solid #d8d1c4;margin:14px 0"/><b>유식의 위험</b><div style="font-size:14px;line-height:1.6;margin-top:8px">논리만 추적하면 체험 없는 개념 이해에 머물 수 있다.</div></div><div style="background:#e6ddcc;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center"><b style="font-size:20px">서로의 보완</b><div style="font-size:14px;line-height:1.65;margin-top:8px">선은 체험을 경론과 스승의 점검 속에서 반성하고, 유식은 수행 체험을 통해 이론을 더 정확히 이해한다.</div></div><div style="background:#20372f;color:white;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center"><b style="font-size:20px">불도의 본의 규명</b><div style="font-size:14px;line-height:1.65;margin-top:8px;opacity:.75">체험과 논리가 함께할 때 자기와 세계의 진실을 더 깊게 규명한다.</div></div></div></div>
  <div style="background:#e6ddcc;border-radius:24px;padding:28px;margin-top:18px"><div style="font-size:30px;font-weight:900">오늘 반드시 기억할 3가지</div><div style="display:grid;gap:10px;margin-top:16px"><div style="background:#fffdf8;border-radius:14px;padding:14px"><b>1.</b> 선은 깨달음의 직접성·체험을, 유식은 논리적 설명·체계화를 중시한다.</div><div style="background:#fffdf8;border-radius:14px;padding:14px"><b>2.</b> 두 전통은 모두 ‘진실한 자기’를 규명하는 길이라는 점에서 만난다.</div><div style="background:#fffdf8;border-radius:14px;padding:14px"><b>3.</b> 저자는 선의 체험과 유식의 논리가 서로의 한계를 보완한다고 본다.</div></div><div style="margin-top:14px;font-size:14px"><b>KEY WORDS</b> · 불립문자 · 직지인심 · 돈오 · 유식 · 아뢰야식 · 유가행 · 기사구명 · 무분별지</div></div>
  <div style="font-size:11px;color:#777;margin-top:16px;text-align:right">자료: 사용자 제공 「선과 유식(cut)-시작하며(1).pdf」 1–4쪽을 바탕으로 재구성</div>
</div>
</foreignObject></svg>